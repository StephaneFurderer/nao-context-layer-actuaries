name: context-tests
on:
  pull_request:
    paths: ["context/**", "data/**", "evals/**", "talk/**"]
  schedule:
    - cron: "17 6 * * 1"   # weekly, as the nao playbook suggests
jobs:
  offline:
    # Always runs: data regenerates, reference SQL executes, talk timing holds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: make data context check-sql talk
  agent:
    # Runs nao test against the real agent. Needs secrets; skipped when absent.
    runs-on: ubuntu-latest
    needs: offline
    if: ${{ vars.NAO_AGENT_TESTS == 'true' }}
    env:
      NAO_API_KEY: ${{ secrets.NAO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && make data context
      - run: cd context && (nao chat &) && sleep 20 && nao test -k 3
